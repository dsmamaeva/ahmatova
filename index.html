<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория Высоких Температур</title>
    <style>
        @font-face {
            font-family: 'Bebas Neue Cyrillic';
            src: url('fonts/BebasNeueCyrillic.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            margin: 0;
            padding: 0;
            padding-top: 104px;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 104px;
            background: #000;
            z-index: 1000;
            min-width: 980px; /* чтобы элементы не выезжали за экран */
        }
        .header-content {
            position: relative;
            width: 100vw;
            height: 104px;
            min-width: 980px;
        }
        .logo {
            position: absolute;
            left: 94px;
            top: 43px;
            width: 78px;
            height: 32px;
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .btn-contacts {
            position: absolute;
            left: 831px;
            top: 43px;
            width: 140px;
            height: 32px;
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .btn-contacts:hover {
            background: #000;
            color: #fff;
            border-color: #fff;
        }
        @media (max-width: 980px) {
            .header, .header-content {
                min-width: 0;
                width: 100vw;
            }
            .btn-contacts {
                left: auto;
                right: 20px;
                top: 43px;
                width: auto;
                min-width: 120px;
                font-size: 14px;
            }
            .logo {
                left: 24px;
                top: 43px;
                width: 50px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="https://psv4.userapi.com/s/v1/d2/Gtk-B8eX10ZlNgycBJwTvpjWIyOeFK1OgQNi1W_9cgyDWKf0FWxyGWuxeqF6d6GtGS5laLyGOHzSSArOoLAdO1DlqS4EzmrQTMDKUVfsIJa05ZHzH_Q0L-nAiIll-NolrDB0uRFYa-Gy/Resurs_141_1.png" alt="Логотип ДВТ">
            </div>
            <button class="btn-contacts">КОНТАКТЫ</button>
        </div>
    </header>
    <!-- Остальная страница... -->
</body>
</html>
